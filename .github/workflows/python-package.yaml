name: Coverage CI
on: [push, pull_request]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    continue-on-error: true
    name: Analyze the repo with CodeSee
    steps:
      - uses: Codesee-io/codesee-action@v2
        with:
          codesee-token: ${{ secrets.CODESEE_ARCH_DIAG_API_TOKEN }}
          codesee-url: https://app.codesee.io

  lint:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
            python-version: ${{ matrix.python-version }}
            cache: "pip"

      - name: "Install and run pre-commit via tox"
        run: |
              python -m pip install tox==3.27.1 tox-gh-actions
              python -m tox -vv

  documentation-linkage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: readthedocs/actions/preview@v1
        with:
          project-slug: "readthedocs-preview"

  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        dependencies: ['minimal', 'all-extras']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Validate lockfile
        run: uv lock --check

      - name: Install minimal dependencies
        if: matrix.dependencies == 'minimal'
        run: uv sync --locked --python ${{ matrix.python-version }} --extra test

      - name: Install all extras
        if: matrix.dependencies == 'all-extras'
        run: uv sync --locked --python ${{ matrix.python-version }} --all-extras

      - name: Run tests
        run: |
          uv run --no-sync --python ${{ matrix.python-version }} \
            pytest tests/ -q -W error -rs

      - name: Run coverage
        if: matrix.dependencies == 'all-extras'
        run: |
          uv run --no-sync --python ${{ matrix.python-version }} \
            pytest tests/ --cov=eule --cov-report=term-missing \
            -q -W error
